<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 22% 18%, #2b2a63 0%, #141433 38%, #08081a 72%, #050510 100%);
    font-family: "Microsoft YaHei", sans-serif;
    position: relative;
    color: #f2f0ff;
  }
  .aurora {
    position: absolute; inset: -20%;
    background:
      radial-gradient(ellipse 46% 32% at 18% 22%, rgba(142,124,248,.55), transparent 70%),
      radial-gradient(ellipse 40% 26% at 78% 30%, rgba(88,196,220,.40), transparent 72%),
      radial-gradient(ellipse 52% 30% at 60% 88%, rgba(226,124,178,.34), transparent 74%);
    filter: blur(28px);
  }
  .stars { position: absolute; inset: 0; }
  .stars i {
    position: absolute; background: #fff; border-radius: 50%;
    animation: none;
  }
  .glow-ring {
    position: absolute; width: 620px; height: 620px; border-radius: 50%;
    right: -60px; top: 5px;
    background: radial-gradient(circle, rgba(142,124,248,.30), rgba(142,124,248,.05) 55%, transparent 70%);
    filter: blur(6px);
  }
  .capsule {
    position: absolute; right: 150px; top: 150px;
    width: 132px; height: 330px; border-radius: 66px;
    background: linear-gradient(160deg, rgba(255,255,255,.96), rgba(200,190,255,.82) 42%, rgba(142,124,248,.9));
    box-shadow: 0 0 60px rgba(160,142,255,.85), 0 0 140px rgba(142,124,248,.55), inset 0 0 30px rgba(255,255,255,.6);
    transform: rotate(-12deg);
  }
  .capsule::after {
    content: ""; position: absolute; left: 22px; top: 26px;
    width: 26px; height: 120px; border-radius: 20px;
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.1));
    filter: blur(2px);
  }
  .content { position: absolute; left: 84px; top: 118px; width: 640px; }
  .logo { display: flex; align-items: center; gap: 14px; margin-bottom: 44px; }
  .dot {
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #fff, #a08cff 60%, #6d5ce0);
    box-shadow: 0 0 18px rgba(160,140,255,.9);
  }
  .brand { font-size: 24px; letter-spacing: 4px; color: rgba(242,240,255,.72); }
  h1 {
    font-size: 78px; font-weight: 700; line-height: 1.18; letter-spacing: 2px;
    text-shadow: 0 6px 40px rgba(120,100,220,.5);
  }
  h1 em { font-style: normal; color: #b9a8ff; }
  p.sub {
    margin-top: 30px; font-size: 27px; line-height: 1.7; font-weight: 300;
    color: rgba(232,228,255,.74); letter-spacing: 1px;
  }
  .foot {
    position: absolute; left: 84px; bottom: 56px;
    font-size: 20px; letter-spacing: 3px; color: rgba(200,192,240,.5);
  }
</style>
</head>
<body>
  <div class="aurora"></div>
  <div class="stars" id="stars"></div>
  <div class="glow-ring"></div>
  <div class="capsule"></div>
  <div class="content">
    <div class="logo"><span class="dot"></span><span class="brand">心事胶囊</span></div>
    <h1>把心事，<br />封进一颗<em>星</em></h1>
    <p class="sub">写下一句话，让 AI 给你一封有质感的回响。<br />每一颗胶囊，都是你情绪的颜色。</p>
  </div>
  <div class="foot">HEART CAPSULE · 情绪记录</div>
  <script>
    const box = document.getElementById('stars');
    for (let i = 0; i < 130; i++) {
      const s = document.createElement('i');
      const size = Math.random() * 2.4 + 0.8;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = Math.random() * 1200 + 'px';
      s.style.top = Math.random() * 630 + 'px';
      s.style.opacity = (Math.random() * 0.7 + 0.22).toFixed(2);
      box.appendChild(s);
    }
  </script>
</body>
</html>
