<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><style>
  html,body{margin:0;width:512px;height:512px;overflow:hidden}
  .bg{width:512px;height:512px;background:radial-gradient(circle at 30% 26%, #33316e 0%, #171636 46%, #0a0a1c 100%);position:relative}
  .capsule{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-18deg);
    width:104px;height:236px;border-radius:52px;
    background:linear-gradient(160deg,#fff,#cfc4ff 45%,#8e7cf8);
    box-shadow:0 0 50px rgba(160,140,255,.9),0 0 110px rgba(142,124,248,.6),inset 0 0 24px rgba(255,255,255,.7)}
  .capsule::after{content:"";position:absolute;left:18px;top:22px;width:20px;height:92px;border-radius:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.08));filter:blur(2px)}
</style></head>
<body><div class="bg"><div class="capsule"></div></div></body></html>
